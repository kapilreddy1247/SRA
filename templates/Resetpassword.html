<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — Smart Resume Analyzer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/Styles.css') }}"/>
</head>
<body>

  <nav class="navbar">
    <div class="nav-left"></div>
    <a href="{{ url_for('login') }}" class="nav-brand">
      <span class="nav-brand-text">Smart Resume <span>Analyzer</span></span>
    </a>
    <div class="nav-right"></div>
  </nav>

  <div class="page-center">
    <div class="single-card">

      <div class="form-title">Reset Password</div>
      <div class="form-sub">Enter your new password below.</div>

      {% if error %}
        <div class="alert alert-err show form-alert">{{ error }}</div>
      {% endif %}

      <form method="POST" action="{{ url_for('reset_password', token=token) }}"
        class="fields">

        <div class="field">
          <label class="field-label" for="password">New Password</label>
          <div class="input-wrap">
            <input id="password" name="password" type="password"
              class="field-input has-btn"
              placeholder="Min 8 characters"
              required minlength="8"/>
            <button type="button" class="show-pw-btn"
              onclick="toggleVisibility('password', this)">Show</button>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="confirm">Confirm New Password</label>
          <div class="input-wrap">
            <input id="confirm" name="confirm" type="password"
              class="field-input has-btn"
              placeholder="Re-enter password"
              required minlength="8"/>
            <button type="button" class="show-pw-btn"
              onclick="toggleVisibility('confirm', this)">Show</button>
          </div>
        </div>

        <button type="submit" class="btn btn-blue">Reset Password</button>

      </form>

    </div>
  </div>

  <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
</body>
</html>
